[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-servidor"
version = "0.2.0"
description = "Aurora: base de sustentabilidade de Minas Gerais e monitoramento ambiental de salas de aula."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29",
    "tzdata>=2024.1",  # fusos horários no Windows (zoneinfo precisa dele lá)
    "defusedxml>=0.7",  # leitura segura dos feeds de notícias
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "httpx2>=2; python_version >= '3.10'",  # cliente de testes das versões novas do Starlette
    "ruff>=0.5",
]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.setuptools.package-data]
aurora = ["static/*", "static/icones/*", "dados/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Qualquer aviso do NOSSO código (ex.: conexão esquecida aberta) vira falha. Avisos de
# "isto vai mudar" das bibliotecas não quebram os testes.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["aurora"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
