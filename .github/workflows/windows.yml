# Gera o instalador da Aurora para Windows, testa num Windows de verdade e publica.
name: App Windows

on:
  push:
    branches: [main]
    paths:
      - "servidor/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: false

jobs:
  instalador:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install ./servidor pyinstaller

      - name: Empacotar (Aurora.exe)
        run: python servidor/empacotamento/construir.py

      - name: Testar o programa empacotado
        shell: pwsh
        run: |
          $pasta = Join-Path $env:RUNNER_TEMP "aurora-teste"
          $p = Start-Process -FilePath "servidor\dist\Aurora\Aurora.exe" `
                 -ArgumentList "--verificar","--porta","18900","--pasta",$pasta,"--so-neste-computador" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $pasta "aurora.log"); exit 1 }
          Write-Host "Aurora.exe funcionou."

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        env:
          AURORA_VERSAO: 0.2.${{ github.run_number }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "servidor\empacotamento\aurora.iss"'

      - name: Testar o instalador (instala, abre, confere)
        shell: pwsh
        run: |
          $i = Start-Process -FilePath "servidor\dist\Aurora-Instalador-Windows.exe" `
                 -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($i.ExitCode -ne 0) { Write-Error "Instalação falhou ($($i.ExitCode))"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Aurora\Aurora.exe"
          if (-not (Test-Path $exe)) { Write-Error "Aurora.exe não foi instalado"; exit 1 }
          $atalho = Join-Path ([Environment]::GetFolderPath("Programs")) "Aurora.lnk"
          if (-not (Test-Path $atalho)) { Write-Error "Atalho do menu Iniciar não foi criado"; exit 1 }
          $pasta = Join-Path $env:RUNNER_TEMP "aurora-teste-instalado"
          $p = Start-Process -FilePath $exe `
                 -ArgumentList "--verificar","--porta","18901","--pasta",$pasta,"--so-neste-computador" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $pasta "aurora.log"); exit 1 }
          Write-Host "Instalador funcionou: programa instalado, atalho criado e Aurora respondendo."

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-instalador-windows
          path: servidor/dist/Aurora-Instalador-Windows.exe

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v0.2.${{ github.run_number }}
          name: Aurora para Windows (0.2.${{ github.run_number }})
          make_latest: false
          body: |
            Baixe **Aurora-Instalador-Windows.exe** e dê dois cliques.
            Se o Windows mostrar "O Windows protegeu o computador", clique em
            **Mais informações → Executar assim mesmo** (o programa ainda não tem assinatura digital paga).
            Não precisa de senha de administrador. A Aurora aparece no menu Iniciar.
          files: servidor/dist/Aurora-Instalador-Windows.exe
