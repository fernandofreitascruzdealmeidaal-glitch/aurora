# Gera o instalador da Aurora para Windows, testa num Windows de verdade e publica.
name: App Windows

on:
  push:
    branches: [main]
    paths:
      - "servidor/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: false

jobs:
  pelo-python:
    # O caminho que funciona com o "Controle Inteligente de Aplicativos" ligado:
    # instala com o pip direto do GitHub e cria atalhos que usam o Python (assinado).
    name: Instalação pelo Python (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar exatamente como o usuário (link do GitHub)
        run: python -m pip install --user "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip#subdirectory=servidor"

      - name: Criar atalhos
        run: python -m aurora.atalho --sem-abrir

      - name: Conferir os atalhos com o próprio Windows
        shell: pwsh
        run: |
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Aurora.lnk"
          $area = Join-Path ([Environment]::GetFolderPath("Desktop")) "Aurora.lnk"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($lnk in @($menu, $area)) {
            if (-not (Test-Path $lnk)) { Write-Error "Faltou o atalho $lnk"; exit 1 }
            $a = $shell.CreateShortcut($lnk)
            Write-Host "$lnk -> $($a.TargetPath) $($a.Arguments) (ícone: $($a.IconLocation))"
            if ($a.TargetPath -notmatch "pythonw\.exe$") { Write-Error "Destino errado"; exit 1 }
            if ($a.Arguments -ne "-m aurora.desktop") { Write-Error "Argumentos errados"; exit 1 }
            if (-not (Test-Path ($a.IconLocation -replace ",\d+$", ""))) { Write-Error "Ícone não encontrado"; exit 1 }
          }

      - name: Ligar a Aurora pelo Python e conferir
        run: python -m aurora.desktop --verificar --porta 18910 --so-neste-computador --pasta "${{ runner.temp }}\aurora-py"

      - name: Abrir um atalho de verdade (pelo Windows) e ver a Aurora ligar
        shell: pwsh
        run: |
          # Mesmo formato de atalho, com --verificar para o teste terminar sozinho.
          $pasta = Join-Path $env:RUNNER_TEMP "aurora-atalho"
          $lnk = Join-Path $env:RUNNER_TEMP "AuroraTeste.lnk"
          python -c "import sys; from pathlib import Path; from aurora import atalho; atalho.criar_atalhos([Path(sys.argv[1])], '-m aurora.desktop --verificar --porta 18912 --so-neste-computador --pasta ' + sys.argv[2]) or sys.exit(1)" $lnk $pasta
          Start-Process -FilePath $lnk
          $log = Join-Path $pasta "aurora.log"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Finished server process" -Quiet)) { break }
          }
          if (-not (Test-Path (Join-Path $pasta "aurora.db"))) { Write-Error "O atalho não ligou a Aurora"; exit 1 }
          Get-Content $log | Select-Object -Last 5
          Write-Host "O atalho abriu a Aurora pelo Python."

  instalador:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install ./servidor pyinstaller

      - name: Empacotar (Aurora.exe)
        run: python servidor/empacotamento/construir.py

      - name: Testar o programa empacotado
        shell: pwsh
        run: |
          $pasta = Join-Path $env:RUNNER_TEMP "aurora-teste"
          $p = Start-Process -FilePath "servidor\dist\Aurora\Aurora.exe" `
                 -ArgumentList "--verificar","--porta","18900","--pasta",$pasta,"--so-neste-computador" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $pasta "aurora.log"); exit 1 }
          Write-Host "Aurora.exe funcionou."

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        env:
          AURORA_VERSAO: 0.2.${{ github.run_number }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "servidor\empacotamento\aurora.iss"'

      - name: Testar o instalador (instala, abre, confere)
        shell: pwsh
        run: |
          $i = Start-Process -FilePath "servidor\dist\Aurora-Instalador-Windows.exe" `
                 -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($i.ExitCode -ne 0) { Write-Error "Instalação falhou ($($i.ExitCode))"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Aurora\Aurora.exe"
          if (-not (Test-Path $exe)) { Write-Error "Aurora.exe não foi instalado"; exit 1 }
          $atalho = Join-Path ([Environment]::GetFolderPath("Programs")) "Aurora.lnk"
          if (-not (Test-Path $atalho)) { Write-Error "Atalho do menu Iniciar não foi criado"; exit 1 }
          $pasta = Join-Path $env:RUNNER_TEMP "aurora-teste-instalado"
          $p = Start-Process -FilePath $exe `
                 -ArgumentList "--verificar","--porta","18901","--pasta",$pasta,"--so-neste-computador" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content (Join-Path $pasta "aurora.log"); exit 1 }
          Write-Host "Instalador funcionou: programa instalado, atalho criado e Aurora respondendo."

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-instalador-windows
          path: servidor/dist/Aurora-Instalador-Windows.exe

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v0.2.${{ github.run_number }}
          name: Aurora para Windows (0.2.${{ github.run_number }})
          make_latest: false
          body: |
            Baixe **Aurora-Instalador-Windows.exe** e dê dois cliques.
            Se o Windows mostrar "O Windows protegeu o computador", clique em
            **Mais informações → Executar assim mesmo** (o programa ainda não tem assinatura digital paga).
            Não precisa de senha de administrador. A Aurora aparece no menu Iniciar.
          files: servidor/dist/Aurora-Instalador-Windows.exe
