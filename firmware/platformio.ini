; Firmware do sensor Aurora (ESP32 + Sensirion SCD40/SCD41)
; Compilar e gravar:  pio run -t upload    |    Ver mensagens:  pio device monitor

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sensirion/Sensirion I2C SCD4x@^1.0.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

; Ambiente de verificação: compila sem config.h e sem sensor (usado pela integração contínua).
[env:simulado]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAURORA_USAR_EXEMPLO=1
    -DAURORA_FORCAR_SIMULACAO=1

; Mesma verificação, mas incluindo o código do sensor real (confere a biblioteca SCD4x).
[env:verificar-sensor]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DAURORA_USAR_EXEMPLO=1
